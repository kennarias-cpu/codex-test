<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Osa Golf Course | Prospect Dashboard</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="admin-body">
  <main class="dashboard-container">
    <div class="dashboard-header">
      <h1>Prospect Dashboard</h1>
      <a class="cta-button secondary" href="/">Back to Landing Page</a>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Date</th><th>Name</th><th>Contact</th><th>Country</th><th>Budget</th><th>Interest</th><th>Preferred Area</th><th>Classification</th><th>Message</th>
          </tr>
        </thead>
        <tbody>
          {{rows}}
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
